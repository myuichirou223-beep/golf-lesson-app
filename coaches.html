<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>コーチ管理 | eXGOLFLAB</title>
  <meta name="description" content="eXGOLFLABのコーチ別レッスン実績管理">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ===== Header ===== -->
  <header class="header">
    <div class="header-left">
      <h1>eXGOLFLAB 実績管理</h1>
    </div>
    <nav class="header-nav">
      <a href="index.html" class="nav-link">ダッシュボード</a>
      <a href="coaches.html" class="nav-link active">コーチ管理</a>
      <a href="settings.html" class="nav-link">設定</a>
    </nav>
    <div class="header-right">
      <select id="monthSelector" class="month-selector" aria-label="表示月を選択"></select>
      <button class="btn btn-outline" id="openExportModalBtn">データ出力 ▾</button>
      <button class="btn btn-primary" id="addCoachBtn">＋ コーチ登録</button>
    </div>
  </header>

  <!-- ===== Main Content ===== -->
  <main class="dashboard">

    <!-- Coach List -->
    <section class="coach-list-section" aria-label="コーチ一覧">
      <div class="section-header">
        <h2 class="section-title">コーチ一覧</h2>
        <span class="coach-count" id="coachCount">0名</span>
      </div>
      <div class="coach-grid" id="coachGrid"></div>
    </section>

    <!-- Coach Detail -->
    <section class="coach-detail-section" id="coachDetailSection" style="display:none;" aria-label="コーチ詳細">

      <div class="coach-info-bar" id="coachInfoBar">
        <div class="coach-info-left">
          <div class="coach-avatar-lg" id="coachAvatar">—</div>
          <div class="coach-info-text">
            <h2 class="coach-detail-name" id="coachDetailName">—</h2>
            <div class="coach-meta">
              <span class="coach-specialties" id="coachSpecialties">—</span>
              <span class="coach-separator">·</span>
              <span class="coach-since" id="coachSince">—</span>
            </div>
            <p class="coach-bio" id="coachBio"></p>
          </div>
        </div>
        <div class="coach-info-actions">
          <button class="btn btn-outline btn-sm" id="editCoachBtn">編集</button>
          <button class="btn btn-danger-outline btn-sm" id="deleteCoachBtn">削除</button>
        </div>
      </div>

      <div class="coach-kpi-row" style="grid-template-columns: repeat(3, 1fr);">
        <div class="kpi-card" id="coachKpiLessons">
          <span class="kpi-label">今月レッスン数</span>
          <span class="kpi-value">--</span>
          <span class="kpi-change neutral">--</span>
        </div>
        <div class="kpi-card" id="coachKpiUtilization">
          <span class="kpi-label">稼働率</span>
          <span class="kpi-value">--</span>
          <span class="kpi-change neutral">--</span>
        </div>
        <div class="kpi-card" id="coachKpiTotal">
          <span class="kpi-label">累計レッスン数</span>
          <span class="kpi-value">--</span>
          <span class="kpi-change neutral">--</span>
        </div>
      </div>

      <div class="charts-section">
        <div class="chart-card">
          <h2 class="card-title">月別レッスン推移</h2>
          <canvas id="coachLessonChart"></canvas>
        </div>
        <div class="chart-card">
          <h2 class="card-title">メニュー別内訳</h2>
          <canvas id="coachTypeChart"></canvas>
        </div>
      </div>

      <div class="table-card">
        <div class="table-header">
          <h2 class="card-title">レッスン履歴</h2>
          <span class="table-count" id="lessonHistoryCount">0件</span>
        </div>
        <div style="overflow-x:auto;">
          <table class="data-table" id="lessonHistoryTable">
            <thead>
              <tr>
                <th>日付</th>
                <th>時間</th>
                <th>顧客名</th>
                <th>メニュー</th>
                <th class="text-right">単価</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </section>

    <section class="coach-empty-detail" id="coachEmptyDetail">
      <div class="empty-state">
        <div class="empty-state-text">上のコーチカードを選択すると、詳細が表示されます</div>
      </div>
    </section>
  </main>

  <!-- ===== Export Modal ===== -->
  <div class="modal-overlay" id="exportModal" role="dialog" aria-modal="true" aria-labelledby="exportModalTitle">
    <div class="modal">
      <div class="modal-header">
        <h3 id="exportModalTitle">データ出力設定</h3>
        <button class="modal-close" id="closeExportModal" aria-label="閉じる">&times;</button>
      </div>
      <form id="exportForm" class="modal-form">
        <div class="form-group">
          <label for="exportDataType">1. 出力するデータ内容</label>
          <select id="exportDataType" required>
            <option value="lessons">レッスン実績データ</option>
            <option value="coach_summary">コーチ別集計データ</option>
            <option value="sales">売上明細データ</option>
            <option value="monthly_summary">月別売上サマリー</option>
          </select>
        </div>
        <div class="form-group">
          <label for="exportPeriodType">2. 対象期間</label>
          <select id="exportPeriodType" required>
            <option value="selected_month">選択中の月（画面選択月）</option>
            <option value="current_month">今月</option>
            <option value="all">全期間</option>
            <option value="custom">指定期間（日付範囲）</option>
          </select>
        </div>
        <div class="form-row" id="customDateRangeRow" style="display:none;">
          <div class="form-group">
            <label for="exportStartDate">開始日</label>
            <input type="date" id="exportStartDate">
          </div>
          <div class="form-group">
            <label for="exportEndDate">終了日</label>
            <input type="date" id="exportEndDate">
          </div>
        </div>
        <div class="form-group">
          <label for="exportFormat">3. ファイル形式</label>
          <select id="exportFormat" required>
            <option value="csv">CSVファイル (.csv / UTF-8)</option>
            <option value="pdf">PDFファイル / 印刷 (.pdf)</option>
          </select>
        </div>
        <button type="submit" class="btn btn-primary btn-full">データを書き出す</button>
      </form>
    </div>
  </div>

  <!-- ===== Coach Registration Modal ===== -->
  <div class="modal-overlay" id="coachModal" role="dialog" aria-modal="true" aria-labelledby="coachModalTitle">
    <div class="modal">
      <div class="modal-header">
        <h3 id="coachModalTitle">コーチ登録</h3>
        <button class="modal-close" id="closeCoachModal" aria-label="閉じる">&times;</button>
      </div>
      <form id="coachForm" class="modal-form">
        <div class="form-group">
          <label for="coachNameInput">氏名</label>
          <input type="text" id="coachNameInput" required placeholder="例: 山田 太郎">
        </div>
        <div class="form-group">
          <label>得意分野</label>
          <div class="checkbox-group" id="specialtiesGroup"></div>
        </div>
        <div class="form-group">
          <label for="coachBioInput">一言・プロフィール</label>
          <input type="text" id="coachBioInput" placeholder="任意">
        </div>
        <button type="submit" class="btn btn-primary btn-full">登録する</button>
      </form>
    </div>
  </div>

  <!-- ===== Edit Coach Modal ===== -->
  <div class="modal-overlay" id="editCoachModal" role="dialog" aria-modal="true" aria-labelledby="editCoachModalTitle">
    <div class="modal">
      <div class="modal-header">
        <h3 id="editCoachModalTitle">コーチ情報編集</h3>
        <button class="modal-close" id="closeEditCoachModal" aria-label="閉じる">&times;</button>
      </div>
      <form id="editCoachForm" class="modal-form">
        <input type="hidden" id="editCoachId">
        <div class="form-group">
          <label for="editCoachName">氏名</label>
          <input type="text" id="editCoachName" required>
        </div>
        <div class="form-group">
          <label>得意分野</label>
          <div class="checkbox-group" id="editSpecialtiesGroup"></div>
        </div>
        <div class="form-group">
          <label for="editCoachBioInput">一言・プロフィール</label>
          <input type="text" id="editCoachBioInput">
        </div>
        <button type="submit" class="btn btn-primary btn-full">更新する</button>
      </form>
    </div>
  </div>

  <!-- ===== Delete Confirm Modal ===== -->
  <div class="modal-overlay" id="deleteConfirmModal" role="dialog" aria-modal="true">
    <div class="modal modal-sm">
      <div class="modal-header">
        <h3>コーチ削除確認</h3>
        <button class="modal-close" id="closeDeleteModal" aria-label="閉じる">&times;</button>
      </div>
      <div class="modal-form">
        <p class="confirm-text" id="deleteConfirmText">このコーチを削除しますか？</p>
        <div class="confirm-actions">
          <button class="btn btn-outline" id="cancelDeleteBtn">キャンセル</button>
          <button class="btn btn-danger" id="confirmDeleteBtn">削除する</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ===== Toast ===== -->
  <div class="toast" id="toast"></div>

  <script src="cloud.js"></script>
  <script src="shared.js"></script>
  <script src="coaches.js"></script>
</body>
</html>
