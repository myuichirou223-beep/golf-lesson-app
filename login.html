<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ログイン | eXGOLFLAB 実績管理</title>
  <meta name="description" content="eXGOLFLAB実績管理システムへのログイン">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="login-page-body">

  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <h1 class="login-title">eXGOLFLAB 実績管理</h1>
        <p class="login-subtitle">アカウントにログインして開始します</p>
      </div>

      <form id="loginForm" class="login-form">
        <div class="form-group">
          <label for="emailInput">メールアドレス</label>
          <input type="email" id="emailInput" required placeholder="例: admin@golf.local" autocomplete="username">
        </div>
        <div class="form-group">
          <label for="passwordInput">パスワード</label>
          <input type="password" id="passwordInput" required placeholder="••••••••" autocomplete="current-password">
        </div>

        <div id="loginErrorMessage" class="login-error" style="display:none;"></div>

        <button type="submit" class="btn btn-primary btn-full">ログイン</button>
      </form>
    </div>
  </div>

  <script src="cloud.js"></script>
  <script src="login.js"></script>
</body>
</html>
